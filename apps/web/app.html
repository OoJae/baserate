<!doctype html>
<!--
  APP shell: every path that is not a static file or a site page (/borrow, /save, /lend, /liquidate, /risk, /fees,
  /evidence, and unknown paths, which render the 404). It paints paper in light mode and Intaglio in dark mode before
  any CSS arrives. Both shells load the same entry; the router decides what renders.
-->
<html lang="en" data-zone="app">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Baserate · Dollars against your bitcoin, at the base rate</title>
    <meta
      name="description"
      content="Borrow dollars (MUSD) against your bitcoin with no redemption queue, save in wsMUSD, or lend through the vMUSD vault. Built on Mezo's own Morpho Blue."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2EEE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1512" media="(prefers-color-scheme: dark)" />
    <!-- Pre-paint: Note paper or the Intaglio ground (src/brand/tokens.css), until the stylesheet takes over. -->
    <style>
      html {
        background: #f2eee3;
        color: #0c1512;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0c1512;
          color: #f2eee3;
        }
      }
    </style>

    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Baserate" />
    <meta property="og:title" content="Baserate · Dollars against your bitcoin, at the base rate" />
    <meta
      property="og:description"
      content="Borrow dollars against your bitcoin on Mezo with no redemption queue. Save in wsMUSD, lend through the vMUSD vault."
    />
    <meta property="og:url" content="https://baserate-mezo.vercel.app/" />
    <meta property="og:image" content="https://baserate-mezo.vercel.app/brand/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dollars against your bitcoin. At the base rate. An engraved coin with an amber bitcoin centre."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Baserate · Dollars against your bitcoin, at the base rate" />
    <meta
      name="twitter:description"
      content="Borrow dollars against your bitcoin on Mezo with no redemption queue. Save in wsMUSD, lend through the vMUSD vault."
    />
    <meta name="twitter:image" content="https://baserate-mezo.vercel.app/brand/og.png" />
    <meta
      name="twitter:image:alt"
      content="Dollars against your bitcoin. At the base rate. An engraved coin with an amber bitcoin centre."
    />

    <!-- Fonts: the app's first screen sets Bodoni Moda roman (the page title) and Public Sans roman. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/bodoni-moda/files/bodoni-moda-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/public-sans/files/public-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Baserate needs JavaScript to talk to your wallet and the Mezo network.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
