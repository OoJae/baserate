# Baserate on Mezo testnet.
#
# Amounts are raw on-chain integers: MUSD, bcBTC and vault shares in 18-decimal wei; rates, APYs and share prices in
# WAD (1e18 = 1). Event entities are immutable and keyed by transaction hash + log index; aggregates (Protocol,
# Account, Market, Vault, ...) are mutable. Every event entity carries blockNumber, timestamp, transactionHash and
# logIndex; sort history by `timestamp` (or `blockNumber`).

enum Profile {
  STANDARD
  CANARY
}

"Where FlashLiquidator (or a backstop keeper sale) sold BTC."
enum Venue {
  BACKSTOP
  CL200
  VAMM
}

"BaserateAllocator.Action, in contract order (actionId 0..3)."
enum AllocatorAction {
  NONE
  BUFFER_TOP_UP
  TO_MARKET
  TO_LIQUIDITY
}

enum RedirectReason {
  GAUGE_DEAD
  VOTER_UNREADABLE
  NOTIFY_FAILED
}

"FeeRouter.CarryReason: why a gauge's bribe share stays in the router for the next distribute()."
enum CarryReason {
  "Last hour of the epoch, when Mezo's Voter only lets whitelisted veNFTs vote."
  VOTE_WINDOW_CLOSED
  "The bribe contract has no votes (a bribe credited now might never be claimable)."
  NO_VOTES
}

"What a distribute() did with its sMUSD leg."
enum SmusdOutcome {
  "No sMUSD leg (it was 0)."
  NONE
  "The whole leg was donated (SmusdYieldPosted)."
  DONATED
  "Below sMUSD's AmountTooSmall floor: carried to the next call (SmusdYieldDeferred)."
  DEFERRED
  "The donation failed or pulled less; the rest is carried (SmusdYieldFailed). Not yet past the grace period."
  FAILED
  "sMUSD has kept failing past the grace period: the rest was paid to the treasury (SmusdShareToTreasury)."
  TO_TREASURY
}

enum VaultKind {
  "Baserate wsMUSD (ERC-4626 over sMUSD)."
  WSMUSD
  "vMUSD, the Morpho Vault V2 driven by BaserateAllocator."
  VMUSD
  "bMUSD, the liquidation backstop."
  BACKSTOP
}

enum VaultFlowKind {
  DEPOSIT
  WITHDRAW
  "wsMUSD redeemInKind (sMUSD + MUSD out)."
  REDEEM_IN_KIND
}

"Where a backstop exit stands."
enum RedeemStatus {
  "Queued, nothing paid yet."
  PENDING
  "Paid in part (cash was short); the rest stays queued, claimable again at any time."
  PARTIALLY_CLAIMED
  "Fully paid; the request is closed."
  CLAIMED
}

"What produced a share-price observation."
enum SharePriceSource {
  "assets / shares of a deposit or withdrawal (exact up to share rounding)."
  FLOW
  "wsMUSD Synced: stored assets / supply right after a sync."
  SYNC
  "vMUSD AccrueInterest: new total assets / supply."
  VAULT_ACCRUAL
  "Backstop Checkpoint: book / supply."
  BACKSTOP_CHECKPOINT
  "BaserateAllocator CheckpointRecorded: wsMUSD convertToAssets(1e18)."
  ALLOCATOR_CHECKPOINT
}

enum AccountActionKind {
  OPENED
  BORROWED
  REPAID
  EXITED
  COLLATERAL_ADDED
  COLLATERAL_WITHDRAWN
  COME_BACK
  "BorrowAccount.sweep: tokens sent to the clone directly, swept out by the owner."
  SWEPT
}

enum MarketEventKind {
  SUPPLY
  WITHDRAW
  BORROW
  REPAY
  SUPPLY_COLLATERAL
  WITHDRAW_COLLATERAL
  LIQUIDATE
}

enum AllocationKind {
  ALLOCATE
  DEALLOCATE
  FORCE_DEALLOCATE
}

enum AdapterKind {
  "WsMusdLiquidityAdapter (vMUSD's liquidity adapter)."
  WSMUSD_LIQUIDITY
  "MorphoMarketV1AdapterV2 for M1."
  M1_MARKET
  OTHER
}

enum AllocatorFlowKind {
  IDLE_ALLOCATED
  MARKET_LIQUIDITY_PULLED
}

enum BackstopTradeKind {
  "FlashLiquidator sold seized BTC to the backstop (CollateralBought)."
  BUY
  "Dutch-auction fill (AuctionTaken)."
  AUCTION
  "Bounded keeper sale on Tigris (InventorySold)."
  KEEPER_SALE
}

enum TimelockStatus {
  "Queued. Executable from executableAt until expiresAt; past expiresAt it is expired even while still PENDING."
  PENDING
  ACCEPTED
  REVOKED
  "An instant decrease of the same parameter (PendingInvalidated) made it unexecutable."
  INVALIDATED
  """
  Expired (not executed within EXECUTION_WINDOW of executableAt). Set when the same calldata is submitted again or
  its parameter is decreased after expiry; until then an expired submission stays PENDING with expiresAt in the past.
  """
  EXPIRED
}

enum FlashLiquidatorNativeKind {
  "NativeKept: the liquidation's leftover native BTC could not be sent to the caller; it stays for sweepNative."
  KEPT
  "NativeSwept: sweepNative sent the contract's native BTC to `to`."
  SWEPT
}

enum GovernanceEventKind {
  TIMELOCK_SUBMITTED
  TIMELOCK_REVOKED
  TIMELOCK_ACCEPTED
  "PendingInvalidated: an instant decrease made every call queued for the same parameter unexecutable."
  TIMELOCK_INVALIDATED
  GLOBAL_BORROW_CAP_SET
  LIMITS_SET
  FEE_RECIPIENT_SET
  MODULE_APPROVAL_SET
  PAUSED_SET
  CANARY_OPERATOR_SET
  SENTINEL_SET
  GOVERNANCE_TRANSFER_STARTED
  GOVERNANCE_TRANSFERRED
  WSMUSD_CAP_RAISE_SUBMITTED
  WSMUSD_CAP_RAISED
  WSMUSD_CAP_RAISE_REVOKED
  BACKSTOP_DEPOSITS_PAUSED_SET
}

# ---------------------------------------------------------------------------------------------------------------
# Aggregates
# ---------------------------------------------------------------------------------------------------------------

"Protocol-wide totals and the factory's current parameters. Single entity, id `baserate`."
type Protocol @entity(immutable: false) {
  id: ID!
  accountCount: Int!
  canaryAccountCount: Int!
  "Accounts with collateral or borrow shares in M1."
  openPositionCount: Int!
  "MUSD sent to borrowers (BorrowAccount Borrowed.musdOut)."
  totalBorrowed: BigInt!
  "Origination fees charged on borrows (BorrowAccount Borrowed.fee)."
  totalOriginationFees: BigInt!
  "MUSD repaid through BorrowAccounts (Repaid + Exited)."
  totalRepaid: BigInt!
  liquidationCount: Int!
  totalSeizedCollateral: BigInt!
  totalLiquidatorProfit: BigInt!
  distributionCount: Int!
  totalDistributed: BigInt!
  totalToSmusd: BigInt!
  totalToBribes: BigInt!
  "FeeRouter treasury payments, including the sMUSD leg paid to the treasury after the grace period."
  totalToTreasury: BigInt!
  "Part of totalToTreasury that was the sMUSD leg, paid to the treasury because sMUSD kept failing."
  totalSmusdToTreasury: BigInt!
  "MUSD the FeeRouter carries into its next distribute() (the last Distributed.retained)."
  feeRouterCarried: BigInt!
  "Start of the current sMUSD donation failure streak (FeeRouter.smusdFailingSince); 0 while sMUSD is healthy."
  smusdFailingSince: BigInt!
  feeRecipient: Bytes
  globalBorrowCap: BigInt
  borrowPaused: Boolean!
  creditPaused: Boolean!
  governor: Bytes
  pendingGovernor: Bytes
  sentinel: Bytes
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

"Factory limits per profile (LimitsSet). id: `STANDARD` or `CANARY`."
type ProfileLimit @entity(immutable: false) {
  id: ID!
  profile: Profile!
  "Maximum collateral per position (bcBTC wei)."
  positionCap: BigInt!
  "Maximum post-action LTV in basis points."
  ceilingBps: Int!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

"A BorrowAccount clone (AccountCreated) and its M1 position, tracked from Morpho events."
type Account @entity(immutable: false) {
  "The BorrowAccount address (its Morpho position is held under this address)."
  id: Bytes!
  owner: Bytes!
  profile: Profile!
  canary: Boolean!
  "bcBTC collateral in M1."
  collateral: BigInt!
  "M1 borrow shares (debt = shares x market totalBorrowAssets / totalBorrowShares, plus accrual since lastUpdate)."
  borrowShares: BigInt!
  isOpen: Boolean!
  totalBorrowed: BigInt!
  totalFeesPaid: BigInt!
  totalRepaid: BigInt!
  liquidationCount: Int!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdTransactionHash: Bytes!
  lastActivityTimestamp: BigInt!
  actions: [AccountAction!]! @derivedFrom(field: "account")
  marketEvents: [MarketEvent!]! @derivedFrom(field: "account")
  liquidations: [Liquidation!]! @derivedFrom(field: "account")
}

"M1 on Mezo's Morpho Blue. Totals mirror Morpho's storage, updated from its events."
type Market @entity(immutable: false) {
  "Morpho market id."
  id: Bytes!
  loanToken: Bytes!
  collateralToken: Bytes!
  oracle: Bytes!
  irm: Bytes!
  lltv: BigInt!
  totalSupplyAssets: BigInt!
  totalSupplyShares: BigInt!
  totalBorrowAssets: BigInt!
  totalBorrowShares: BigInt!
  totalCollateral: BigInt!
  "totalBorrowAssets / totalSupplyAssets."
  utilization: BigDecimal!
  "Per-second borrow rate (WAD) applied by the last accrual (AccrueInterest.prevBorrowRate)."
  borrowRate: BigInt!
  "Timestamp of the last interest accrual."
  lastUpdate: BigInt!
  totalInterest: BigInt!
  totalFeeShares: BigInt!
  liquidationCount: Int!
  "Most recent liquidation (joins FlashLiquidator.Liquidated to the Morpho Liquidate that precedes it in the tx)."
  lastLiquidation: Liquidation
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  dailySnapshots: [MarketDailySnapshot!]! @derivedFrom(field: "market")
}

"End-of-day M1 state plus the day's volumes. Days without M1 activity have no snapshot."
type MarketDailySnapshot @entity(immutable: false) {
  "market id + day (big-endian int32)."
  id: Bytes!
  market: Market!
  "Unix day: timestamp / 86400."
  day: Int!
  "Start of the day (unix seconds)."
  timestamp: BigInt!
  totalSupplyAssets: BigInt!
  totalSupplyShares: BigInt!
  totalBorrowAssets: BigInt!
  totalBorrowShares: BigInt!
  totalCollateral: BigInt!
  utilization: BigDecimal!
  borrowRate: BigInt!
  supplied: BigInt!
  withdrawn: BigInt!
  borrowed: BigInt!
  repaid: BigInt!
  collateralSupplied: BigInt!
  collateralWithdrawn: BigInt!
  interest: BigInt!
  liquidations: Int!
  seizedCollateral: BigInt!
  updatedAtBlock: BigInt!
}

"wsMUSD, vMUSD or the backstop (bMUSD)."
type Vault @entity(immutable: false) {
  "Vault address."
  id: Bytes!
  kind: VaultKind!
  "Shares outstanding, from mints and burns in the vault's events."
  totalSupply: BigInt!
  """
  Assets backing the shares as of the last event. vMUSD: exact (AccrueInterest + flows). Backstop: the recognised
  book (Checkpoint + deposits). wsMUSD: stored assets after a sync, otherwise sharePrice x totalSupply.
  """
  totalAssets: BigInt!
  "Assets per 1e18 shares (WAD), last observation."
  sharePrice: BigInt!
  depositCount: Int!
  withdrawCount: Int!
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
  "wsMUSD / backstop: gains still vesting, and when they finish."
  unvested: BigInt
  vestingEnd: BigInt
  "Backstop: BTC held for sale."
  inventory: BigInt
  "Backstop: assets reserved for queued exits, and how many requests are open (pending or partially claimed)."
  reservedAssets: BigInt
  pendingRedeemCount: Int
  depositsPaused: Boolean
  "vMUSD: fee shares minted by accruals."
  performanceFeeShares: BigInt
  managementFeeShares: BigInt
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  flows: [VaultFlow!]! @derivedFrom(field: "vault")
  sharePrices: [SharePricePoint!]! @derivedFrom(field: "vault")
}

"A vault's share price, at most one point per block (the block's last observation)."
type SharePricePoint @entity(immutable: false) {
  "vault address + block number (big-endian int32)."
  id: Bytes!
  vault: Vault!
  sharePrice: BigInt!
  totalAssets: BigInt!
  totalSupply: BigInt!
  source: SharePriceSource!
  blockNumber: BigInt!
  timestamp: BigInt!
}

"""
A backstop exit: requestRedeem, then claimRedeem (or claimRedeemWithoutOracle) after the delay. When cash is short a
claim pays what there is, burns the matching shares and keeps the rest queued (RedeemPartiallyClaimed); the request
closes only when fully paid. Every payment is a VaultFlow WITHDRAW in `payments`.
"""
type RedeemRequest @entity(immutable: false) {
  "Request id (decimal)."
  id: ID!
  requestId: BigInt!
  vault: Vault!
  owner: Bytes!
  receiver: Bytes!
  "Shares escrowed at request (unchanged by partial claims; see sharesLeft)."
  shares: BigInt!
  "NAV of the shares at request; all claims together pay at most this (see assetsLeft)."
  assets: BigInt!
  claimableAt: BigInt!
  status: RedeemStatus!
  "Escrowed shares not yet paid (the contract's redeemRequest(id).shares); 0 once claimed."
  sharesLeft: BigInt!
  "Request NAV of sharesLeft, the most the remaining claims can pay (redeemRequest(id).assets); 0 once claimed."
  assetsLeft: BigInt!
  "MUSD paid so far (sum of RedeemClaimed.assets)."
  paidAssets: BigInt!
  "Shares burned so far (sum of RedeemClaimed.shares)."
  burnedShares: BigInt!
  "Number of payments (RedeemClaimed events)."
  claimCount: Int!
  "True once fully paid (status CLAIMED)."
  claimed: Boolean!
  "Total MUSD paid, set when the request closes (then equal to paidAssets)."
  claimedAssets: BigInt
  "Block, time and transaction of the final payment."
  claimedAtBlock: BigInt
  claimedAtTimestamp: BigInt
  claimTransactionHash: Bytes
  "Block, time and transaction of the latest payment (partial or final)."
  lastClaimAtBlock: BigInt
  lastClaimAtTimestamp: BigInt
  lastClaimTransactionHash: Bytes
  payments: [VaultFlow!]! @derivedFrom(field: "redeemRequest")
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

"""
A factory call queued behind the 48 h timelock (Submitted), and how it ended. It can be executed from executableAt
until expiresAt (executableAt + EXECUTION_WINDOW, 14 days); live calls are `status: PENDING, expiresAt_gte: now`.
"""
type TimelockSubmission @entity(immutable: false) {
  id: Bytes!
  contract: Bytes!
  selector: Bytes!
  "Full calldata of the queued call."
  data: Bytes!
  """
  The parameter it changes, as PendingInvalidated reports it: the first argument word (profile, module, operator or
  fee recipient), or zero for setGlobalBorrowCap.
  """
  param: Bytes!
  executableAt: BigInt!
  "Last second it can be executed: executableAt + 14 days."
  expiresAt: BigInt!
  status: TimelockStatus!
  resolvedBy: Bytes
  resolvedAtBlock: BigInt
  resolvedAtTimestamp: BigInt
  resolveTransactionHash: Bytes
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

"Internal: the pending submission for a calldata (id = keccak256(data))."
type TimelockSlot @entity(immutable: false) {
  id: Bytes!
  pending: TimelockSubmission
}

"Internal: the pending submissions of one parameter (id = selector ++ param), cleared by PendingInvalidated."
type TimelockParam @entity(immutable: false) {
  id: Bytes!
  pending: [TimelockSubmission!]!
}

# ---------------------------------------------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------------------------------------------

"""
A BorrowAccount action. Fields by kind: OPENED musd, btc; BORROWED musd (to the receiver), fee, debtAfter, ltvBps;
REPAID musd, debtAfter; EXITED musd (repaid), btc (returned), debtAfter = collateralAfter = 0; COLLATERAL_ADDED btc,
collateralAfter; COLLATERAL_WITHDRAWN btc, recipient; COME_BACK btc (BTC claimed from the Mezo surplus pool); SWEPT
token, amount, recipient.
"""
type AccountAction @entity(immutable: true) {
  id: Bytes!
  account: Account!
  owner: Bytes!
  kind: AccountActionKind!
  musd: BigInt
  fee: BigInt
  btc: BigInt
  debtAfter: BigInt
  collateralAfter: BigInt
  ltvBps: Int
  recipient: Bytes
  "SWEPT: the token swept and the amount."
  token: Bytes
  amount: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"""
A Morpho Blue event on M1. `assets` is MUSD (or bcBTC for *_COLLATERAL; repaid MUSD for LIQUIDATE); `shares` is
supply or borrow shares (repaid shares for LIQUIDATE). For Baserate accounts the position after the event is
recorded in collateralAfter / borrowSharesAfter.
"""
type MarketEvent @entity(immutable: true) {
  id: Bytes!
  market: Market!
  kind: MarketEventKind!
  account: Account
  "Morpho onBehalf (the borrower for LIQUIDATE)."
  onBehalf: Bytes!
  caller: Bytes!
  receiver: Bytes
  assets: BigInt!
  shares: BigInt
  collateralAfter: BigInt
  borrowSharesAfter: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"A Morpho liquidation on M1, with FlashLiquidator's sale details when it went through FlashLiquidator."
type Liquidation @entity(immutable: false) {
  id: Bytes!
  market: Market!
  account: Account
  borrower: Bytes!
  "Morpho caller (FlashLiquidator for flash liquidations)."
  caller: Bytes!
  repaidAssets: BigInt!
  repaidShares: BigInt!
  seizedAssets: BigInt!
  badDebtAssets: BigInt!
  badDebtShares: BigInt!
  viaFlashLiquidator: Boolean!
  "FlashLiquidator caller, who received the profit."
  liquidator: Bytes
  venue: Venue
  "MUSD the seized BTC sold for, and the liquidator's profit after repaying the debt."
  proceeds: BigInt
  profit: BigInt
  "Native BTC left by the liquidation that the caller could not take (NativeKept); it waits for sweepNative."
  nativeKept: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"An ERC-4626 deposit or withdrawal (or wsMUSD in-kind redemption)."
type VaultFlow @entity(immutable: true) {
  id: Bytes!
  vault: Vault!
  kind: VaultFlowKind!
  "msg.sender."
  sender: Bytes!
  "Share owner: receives shares on DEPOSIT, has them burned on WITHDRAW / REDEEM_IN_KIND (Vault V2's onBehalf)."
  owner: Bytes!
  "Receives the assets on WITHDRAW / REDEEM_IN_KIND."
  receiver: Bytes
  "MUSD in or out (REDEEM_IN_KIND: smusdOut + musdOut)."
  assets: BigInt!
  shares: BigInt!
  smusdOut: BigInt
  musdOut: BigInt
  "Backstop WITHDRAW: the exit request this payment belongs to."
  redeemRequest: RedeemRequest
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"wsMUSD Synced: a harvest of sMUSD yield and/or absorbed surplus."
type WsMusdSync @entity(immutable: true) {
  id: Bytes!
  harvested: BigInt!
  instant: BigInt!
  surplus: BigInt!
  stored: BigInt!
  unvested: BigInt!
  periodEnd: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"vMUSD Allocate / Deallocate / ForceDeallocate. `change` is the adapter's signed allocation change."
type VaultAllocation @entity(immutable: true) {
  id: Bytes!
  vault: Vault!
  kind: AllocationKind!
  sender: Bytes!
  adapter: Bytes!
  adapterKind: AdapterKind!
  assets: BigInt!
  change: BigInt
  ids: [Bytes!]!
  "ForceDeallocate only."
  onBehalf: Bytes
  penaltyAssets: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"BaserateAllocator.Rebalanced. The app's \"Recent moves\" are the ones with action != NONE."
type Rebalance @entity(immutable: true) {
  id: Bytes!
  action: AllocatorAction!
  actionId: Int!
  amount: BigInt!
  m1SupplyApy: BigInt!
  wsMusdApy: BigInt!
  apyWindow: BigInt!
  m1Liquidity: BigInt!
  bufferTarget: BigInt!
  "Transaction sender (the keeper or whoever rebalanced)."
  from: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"BaserateAllocator IdleAllocated / MarketLiquidityPulled."
type AllocatorFlow @entity(immutable: true) {
  id: Bytes!
  kind: AllocatorFlowKind!
  caller: Bytes
  assets: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"BaserateAllocator.CheckpointRecorded: a wsMUSD share-price observation (at most hourly)."
type AllocatorCheckpoint @entity(immutable: true) {
  id: Bytes!
  index: BigInt!
  observedAt: BigInt!
  sharePrice: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"""
Backstop inventory activity. BUY: trader = seller (FlashLiquidator), price = oracle price; AUCTION: trader = taker,
recipient = BTC receiver, factorWad = auction factor; KEEPER_SALE: trader = caller, venue.
"""
type BackstopTrade @entity(immutable: true) {
  id: Bytes!
  kind: BackstopTradeKind!
  trader: Bytes!
  recipient: Bytes
  btcAmount: BigInt!
  musdAmount: BigInt!
  price: BigInt
  factorWad: BigInt
  venue: Venue
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"""
One FeeRouter.distribute() (Distributed), with the bribes posted, redirected or carried in the same transaction.
total == toSmusd + toBribes + toTreasury + retained.
"""
type Distribution @entity(immutable: true) {
  "Transaction hash (one distribution per transaction)."
  id: Bytes!
  caller: Bytes!
  epochStart: BigInt!
  "MUSD balance split: new fees plus the amounts carried from earlier calls."
  total: BigInt!
  "MUSD actually donated to sMUSD."
  toSmusd: BigInt!
  "MUSD posted as bribes."
  toBribes: BigInt!
  "MUSD paid to the treasury: its 20% of the new fees plus smusdToTreasury."
  toTreasury: BigInt!
  "MUSD carried to the next distribute(): bribesCarried + smusdCarried."
  retained: BigInt!
  "Bribe shares carried (sum of the bribeCarries)."
  bribesCarried: BigInt!
  "Part of the sMUSD leg carried: below sMUSD's dust floor, or a failed donation within the grace period."
  smusdCarried: BigInt!
  "Part of the sMUSD leg paid to the treasury instead (sMUSD failing past the grace period); included in toTreasury."
  smusdToTreasury: BigInt!
  smusdOutcome: SmusdOutcome!
  "FAILED / TO_TREASURY: start of the sMUSD failure streak."
  smusdFailingSince: BigInt
  bribes: [Bribe!]! @derivedFrom(field: "distribution")
  bribeCarries: [BribeCarry!]! @derivedFrom(field: "distribution")
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"A gauge's bribe share: posted (BribePosted) or redirected to sMUSD (BribeRedirected)."
type Bribe @entity(immutable: true) {
  id: Bytes!
  distribution: Distribution!
  gauge: Bytes!
  "BribeVotingReward (posted only)."
  bribe: Bytes
  epochStart: BigInt
  amount: BigInt!
  posted: Boolean!
  redirectReason: RedirectReason
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"A gauge's bribe share kept in the FeeRouter (BribeCarried) and added to that gauge's share in the next distribute()."
type BribeCarry @entity(immutable: true) {
  id: Bytes!
  distribution: Distribution!
  gauge: Bytes!
  amount: BigInt!
  reason: CarryReason!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"Internal: the sMUSD and carry events of a distribute() in progress, folded into its Distribution (id = tx hash)."
type PendingDistribution @entity(immutable: false) {
  id: Bytes!
  bribesCarried: BigInt!
  smusdCarried: BigInt!
  smusdToTreasury: BigInt!
  "NONE until an sMUSD outcome event arrives (DONATED is inferred from Distributed.toSmusd)."
  smusdOutcome: SmusdOutcome!
  smusdFailingSince: BigInt
}

"FlashLiquidator native BTC: leftovers its caller could not take (KEPT) and sweepNative payouts (SWEPT)."
type FlashLiquidatorNative @entity(immutable: true) {
  id: Bytes!
  kind: FlashLiquidatorNativeKind!
  "KEPT: the liquidation caller; SWEPT: whoever called sweepNative."
  caller: Bytes!
  "SWEPT: the recipient."
  to: Bytes
  amount: BigInt!
  "KEPT: the liquidation that left it."
  liquidation: Liquidation
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"""
Parameter and role changes on the factory, wsMUSD and the backstop. Fields by kind: TIMELOCK_SUBMITTED /
TIMELOCK_REVOKED / TIMELOCK_ACCEPTED selector, data, value (executableAt, SUBMITTED only); TIMELOCK_INVALIDATED
selector, param, value (number of queued calls it invalidated); GLOBAL_BORROW_CAP_SET value; LIMITS_SET profile, value (positionCap), value2 (ceilingBps);
FEE_RECIPIENT_SET / SENTINEL_SET target; MODULE_APPROVAL_SET / CANARY_OPERATOR_SET target, flag; PAUSED_SET flag
(borrowPaused), flag2 (creditPaused); GOVERNANCE_TRANSFER_* target (new governor); WSMUSD_CAP_RAISE_SUBMITTED value
(new cap), value2 (executableAt); WSMUSD_CAP_RAISED value (new cap), value2 (old cap); WSMUSD_CAP_RAISE_REVOKED value;
BACKSTOP_DEPOSITS_PAUSED_SET flag.
"""
type GovernanceEvent @entity(immutable: true) {
  id: Bytes!
  contract: Bytes!
  kind: GovernanceEventKind!
  caller: Bytes
  target: Bytes
  selector: Bytes
  data: Bytes
  "TIMELOCK_INVALIDATED: the parameter (first argument word; zero for setGlobalBorrowCap)."
  param: Bytes
  value: BigInt
  value2: BigInt
  flag: Boolean
  flag2: Boolean
  profile: Profile
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}
