# Baserate on Mezo testnet (chain 31611). Addresses and start blocks mirror packages/sdk/src/deployments/31611.json
# (contract deploy blocks; Morpho starts at M1's CreateMarket block); `pnpm check-config` verifies them.
specVersion: 1.0.0
description: Baserate on Mezo testnet - borrow accounts, M1 positions and liquidations, vault flows, allocator moves, backstop exits, fee distributions.
repository: https://github.com/OoJae/baserate
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: BorrowAccountFactory
    network: mezo-testnet
    source:
      address: "0x0EF62F97130fe4D1D22DE4ACc4163154F82890b1"
      abi: BorrowAccountFactory
      startBlock: 16380364
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - AccountAction
        - Protocol
        - ProfileLimit
        - TimelockSubmission
        - TimelockSlot
        - TimelockParam
        - GovernanceEvent
      abis:
        - name: BorrowAccountFactory
          file: ./abis/BorrowAccountFactory.json
      eventHandlers:
        - event: AccountCreated(indexed address,indexed address,uint8)
          handler: handleAccountCreated
        - event: ComeBack(indexed address,indexed address,uint256)
          handler: handleComeBack
        - event: Submitted(indexed bytes4,bytes,uint256)
          handler: handleSubmitted
        - event: Revoked(indexed address,indexed bytes4,bytes)
          handler: handleRevoked
        - event: Accepted(indexed bytes4,bytes)
          handler: handleAccepted
        - event: PendingInvalidated(indexed bytes4,indexed bytes32)
          handler: handlePendingInvalidated
        - event: GlobalBorrowCapSet(indexed address,uint256)
          handler: handleGlobalBorrowCapSet
        - event: LimitsSet(indexed address,indexed uint8,uint128,uint16)
          handler: handleLimitsSet
        - event: FeeRecipientSet(indexed address)
          handler: handleFeeRecipientSet
        - event: ModuleApprovalSet(indexed address,indexed address,bool)
          handler: handleModuleApprovalSet
        - event: PausedSet(indexed address,bool,bool)
          handler: handlePausedSet
        - event: CanaryOperatorSet(indexed address,bool)
          handler: handleCanaryOperatorSet
        - event: SentinelSet(indexed address)
          handler: handleSentinelSet
        - event: GovernanceTransferStarted(indexed address,indexed address)
          handler: handleGovernanceTransferStarted
        - event: GovernanceTransferred(indexed address,indexed address)
          handler: handleGovernanceTransferred
      file: ./src/factory.ts

  - kind: ethereum
    name: Morpho
    network: mezo-testnet
    source:
      address: "0xCe1da828cA15cb1FDAfa84C366A53C8106655a73"
      abi: Morpho
      startBlock: 16380365
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Market
        - MarketDailySnapshot
        - MarketEvent
        - Liquidation
        - Account
        - Protocol
      abis:
        - name: Morpho
          file: ./abis/Morpho.json
      # Mezo's Morpho hosts other markets too: every handler returns early unless the market id is M1.
      eventHandlers:
        - event: CreateMarket(indexed bytes32,(address,address,address,address,uint256))
          handler: handleCreateMarket
        - event: Supply(indexed bytes32,indexed address,indexed address,uint256,uint256)
          handler: handleSupply
        - event: Withdraw(indexed bytes32,address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: Borrow(indexed bytes32,address,indexed address,indexed address,uint256,uint256)
          handler: handleBorrow
        - event: Repay(indexed bytes32,indexed address,indexed address,uint256,uint256)
          handler: handleRepay
        - event: SupplyCollateral(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleSupplyCollateral
        - event: WithdrawCollateral(indexed bytes32,address,indexed address,indexed address,uint256)
          handler: handleWithdrawCollateral
        - event: Liquidate(indexed bytes32,indexed address,indexed address,uint256,uint256,uint256,uint256,uint256)
          handler: handleLiquidate
        - event: AccrueInterest(indexed bytes32,uint256,uint256,uint256)
          handler: handleAccrueInterest
      file: ./src/morpho.ts

  - kind: ethereum
    name: WsMUSD
    network: mezo-testnet
    source:
      address: "0xDAfcB2cD3E722f6FeE7F70150be612F1d7af8124"
      abi: WsMUSD
      startBlock: 16380361
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultFlow
        - SharePricePoint
        - WsMusdSync
        - GovernanceEvent
      abis:
        - name: WsMUSD
          file: ./abis/WsMUSD.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: RedeemedInKind(indexed address,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleRedeemedInKind
        - event: Synced(uint256,uint256,uint256,uint256,uint256,uint64)
          handler: handleSynced
        - event: CapRaiseSubmitted(uint256,uint64)
          handler: handleCapRaiseSubmitted
        - event: CapRaised(uint256,uint256)
          handler: handleCapRaised
        - event: CapRaiseRevoked(uint256)
          handler: handleCapRaiseRevoked
      file: ./src/wsmusd.ts

  - kind: ethereum
    name: VMUSD
    network: mezo-testnet
    source:
      address: "0x76A62fFEFb0b9A5980750Fb106Df05cEff6b941a"
      abi: VaultV2
      startBlock: 16380419
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultFlow
        - VaultAllocation
        - SharePricePoint
      abis:
        - name: VaultV2
          file: ./abis/VaultV2.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: AccrueInterest(uint256,uint256,uint256,uint256)
          handler: handleAccrueInterest
        - event: Allocate(indexed address,indexed address,uint256,bytes32[],int256)
          handler: handleAllocate
        - event: Deallocate(indexed address,indexed address,uint256,bytes32[],int256)
          handler: handleDeallocate
        - event: ForceDeallocate(indexed address,address,uint256,indexed address,bytes32[],uint256)
          handler: handleForceDeallocate
      file: ./src/vmusd.ts

  - kind: ethereum
    name: BaserateAllocator
    network: mezo-testnet
    source:
      address: "0x8B1314D983973342DA53A6E30CD5586d5D92d20f"
      abi: BaserateAllocator
      startBlock: 16380426
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Rebalance
        - AllocatorCheckpoint
        - AllocatorFlow
        - Vault
        - SharePricePoint
      abis:
        - name: BaserateAllocator
          file: ./abis/BaserateAllocator.json
      eventHandlers:
        - event: Rebalanced(indexed uint8,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleRebalanced
        - event: CheckpointRecorded(indexed uint256,uint64,uint256)
          handler: handleCheckpointRecorded
        - event: IdleAllocated(uint256)
          handler: handleIdleAllocated
        - event: MarketLiquidityPulled(indexed address,uint256)
          handler: handleMarketLiquidityPulled
      file: ./src/allocator.ts

  - kind: ethereum
    name: Backstop
    network: mezo-testnet
    source:
      address: "0x64fE4CC966E55A0081913A8Bf72A22b007946C2B"
      abi: Backstop
      startBlock: 16380382
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultFlow
        - SharePricePoint
        - RedeemRequest
        - BackstopTrade
        - GovernanceEvent
      abis:
        - name: Backstop
          file: ./abis/Backstop.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Checkpoint(uint256,uint256,uint64,uint256)
          handler: handleCheckpoint
        - event: CollateralBought(indexed address,uint256,uint256,uint256)
          handler: handleCollateralBought
        - event: RedeemRequested(indexed uint256,indexed address,indexed address,uint256,uint256,uint64)
          handler: handleRedeemRequested
        - event: RedeemClaimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleRedeemClaimed
        - event: RedeemPartiallyClaimed(indexed uint256,uint256,uint256)
          handler: handleRedeemPartiallyClaimed
        - event: AuctionTaken(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleAuctionTaken
        - event: InventorySold(indexed address,indexed uint8,uint256,uint256)
          handler: handleInventorySold
        - event: DepositsPausedSet(bool)
          handler: handleDepositsPausedSet
      file: ./src/backstop.ts

  - kind: ethereum
    name: FlashLiquidator
    network: mezo-testnet
    source:
      address: "0x291868F26639bc619BaC1e87B7a19EE84988E973"
      abi: FlashLiquidator
      startBlock: 16380383
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Liquidation
        - FlashLiquidatorNative
        - Protocol
      abis:
        - name: FlashLiquidator
          file: ./abis/FlashLiquidator.json
      eventHandlers:
        - event: Liquidated(indexed address,indexed address,indexed uint8,uint256,uint256,uint256,uint256)
          handler: handleLiquidated
        - event: NativeKept(indexed address,uint256)
          handler: handleNativeKept
        - event: NativeSwept(indexed address,indexed address,uint256)
          handler: handleNativeSwept
      file: ./src/flash-liquidator.ts

  - kind: ethereum
    name: FeeRouter
    network: mezo-testnet
    source:
      address: "0x2de420D13d808aEBA11AB743abe630D0dD48C13B"
      abi: FeeRouter
      startBlock: 16380398
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Distribution
        - Bribe
        - BribeCarry
        - PendingDistribution
        - Protocol
      abis:
        - name: FeeRouter
          file: ./abis/FeeRouter.json
      eventHandlers:
        - event: Distributed(indexed address,indexed uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleDistributed
        - event: BribePosted(indexed address,indexed address,indexed uint256,uint256)
          handler: handleBribePosted
        - event: BribeRedirected(indexed address,uint256,uint8)
          handler: handleBribeRedirected
        - event: BribeCarried(indexed address,uint256,uint8)
          handler: handleBribeCarried
        - event: SmusdYieldDeferred(uint256)
          handler: handleSmusdYieldDeferred
        - event: SmusdYieldFailed(uint256,uint256)
          handler: handleSmusdYieldFailed
        - event: SmusdShareToTreasury(indexed address,uint256,uint256)
          handler: handleSmusdShareToTreasury
      file: ./src/fee-router.ts

templates:
  - kind: ethereum
    name: BorrowAccount
    network: mezo-testnet
    source:
      abi: BorrowAccount
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - AccountAction
        - Protocol
      abis:
        - name: BorrowAccount
          file: ./abis/BorrowAccount.json
      eventHandlers:
        - event: Opened(indexed address,uint256,uint256)
          handler: handleOpened
        - event: Borrowed(indexed address,uint256,uint256,uint256,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed address,uint256,uint256)
          handler: handleRepaid
        - event: Exited(indexed address,uint256,uint256)
          handler: handleExited
        - event: CollateralAdded(indexed address,uint256,uint256)
          handler: handleCollateralAdded
        - event: CollateralWithdrawn(indexed address,uint256,indexed address)
          handler: handleCollateralWithdrawn
        - event: Swept(indexed address,indexed address,uint256)
          handler: handleSwept
      file: ./src/account.ts
